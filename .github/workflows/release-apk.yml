name: release-apk

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and upload the APK to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-signed-apk:
    name: Build & attach signed release APK
    runs-on: ubuntu-latest
    env:
      # Resolve the release tag from either trigger.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is not set — cannot produce a signed APK."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Provision google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64 secret is not set — release build needs it (default_web_client_id)."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json

      # Without this, the Secrets Gradle Plugin falls back to `.env.example` and
      # bakes `https://us-central1-your-project-id.cloudfunctions.net/` into
      # BuildConfig.FIREBASE_PROXY_URL — GeminiApiClient.proxyService becomes null
      # and the shipped app has no working AI. This is exactly how v1.0.1 shipped.
      - name: Provision .env (Firebase proxy URL)
        env:
          FIREBASE_PROXY_URL: ${{ secrets.FIREBASE_PROXY_URL }}
        run: |
          if [ -z "$FIREBASE_PROXY_URL" ]; then
            echo "::error::FIREBASE_PROXY_URL secret is not set — the build would ship the .env.example placeholder and every AI feature would be dead."
            exit 1
          fi
          case "$FIREBASE_PROXY_URL" in
            *your-project-id*)
              echo "::error::FIREBASE_PROXY_URL secret still contains the 'your-project-id' placeholder."
              exit 1
              ;;
          esac
          # GEMINI_API_KEY intentionally stays a placeholder: the app must always
          # route through the authenticated proxy, never embed a raw key.
          {
            echo "GEMINI_API_KEY=MY_GEMINI_API_KEY"
            echo "FIREBASE_PROXY_URL=$FIREBASE_PROXY_URL"
          } > .env
          echo "Wrote .env (value not echoed)."

      - name: Build signed release APK
        env:
          # Wired to app/build.gradle.kts release signingConfig (env-var fallback).
          KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Locate signed APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" ! -name "*unsigned*" | head -1)
          if [ -z "$APK" ]; then
            echo "::error::No signed release APK found."
            find app/build/outputs/apk -type f -name "*.apk" || true
            exit 1
          fi
          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK is signed
        run: |
          APK="${{ steps.apk.outputs.path }}"
          BT=$(ls "$ANDROID_HOME"/build-tools/ | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK"

      # Fixing the build inputs is not enough — assert against the actual bytes
      # we are about to publish. Anything that reintroduces a placeholder (a
      # dropped secret, a reverted gradle guard, a bad merge) fails here.
      - name: Verify built APK carries real config (no placeholders)
        run: |
          set -euo pipefail
          APK="${{ steps.apk.outputs.path }}"
          SCAN="$RUNNER_TEMP/apk-scan"
          rm -rf "$SCAN"; mkdir -p "$SCAN"
          unzip -o -q "$APK" -d "$SCAN" 'classes*.dex' 'resources.arsc'

          fail=0

          if grep -a -q 'us-central1-your-project-id\.cloudfunctions\.net' "$SCAN"/classes*.dex; then
            echo "::error::APK contains the placeholder Firebase proxy URL — the shipped app would have NO working AI."
            fail=1
          else
            echo "placeholder proxy URL absent: yes"
          fi

          if grep -a -Eq 'https://[a-z0-9-]+-[a-z0-9-]+\.cloudfunctions\.net/' "$SCAN"/classes*.dex; then
            echo "real proxy host present: yes"
          else
            echo "::error::APK contains no Firebase Cloud Function proxy URL at all."
            fail=1
          fi

          for key in google_app_id gcm_defaultSenderId default_web_client_id; do
            if grep -a -q "$key" "$SCAN/resources.arsc"; then
              echo "firebase resource present: $key"
            else
              echo "::error::APK is missing the '$key' resource — google-services.json was not applied; Firebase Auth would crash."
              fail=1
            fi
          done

          rm -rf "$SCAN"
          exit "$fail"

      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="${{ steps.apk.outputs.path }}"
          STABLE="$RUNNER_TEMP/kinetic-ai-coach.apk"
          VERSIONED="$RUNNER_TEMP/kinetic-ai-coach-${RELEASE_TAG}.apk"
          cp "$APK" "$STABLE"
          cp "$APK" "$VERSIONED"
          gh release upload "$RELEASE_TAG" "$STABLE" --clobber -R "$GITHUB_REPOSITORY"
          gh release upload "$RELEASE_TAG" "$VERSIONED" --clobber -R "$GITHUB_REPOSITORY"
