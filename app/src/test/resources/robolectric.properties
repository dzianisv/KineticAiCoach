# Robolectric 4.16.1 has no android-all runtime for API 36, so it throws
# `UnsupportedOperationException at DefaultSdkProvider` when it infers the SDK
# from targetSdk = 36. Pin the JVM-side tests to the newest SDK Robolectric
# actually ships. Bump this when Robolectric adds API 36 support.
sdk=35
